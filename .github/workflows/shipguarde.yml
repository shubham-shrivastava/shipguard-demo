name: ShipGuarde

# Manual while the ShipGuarde GitHub App reviews this repo's pull requests;
# the App and this Action would otherwise each run on every PR. Switch back
# to `pull_request:` for the Action-only path.
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  review:
    name: ShipGuarde review
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the Railway preview
        run: |
          url="https://shipguard-demo-shipguard-demo-pr-${{ github.event.number }}.up.railway.app/"
          for i in $(seq 1 40); do
            curl -sf -o /dev/null "$url" && exit 0
            sleep 15
          done
          echo "preview never came up: $url" && exit 1

      - id: shipguarde
        uses: ShipGuarde/review-action@v1
        with:
          api-key: ${{ secrets.SHIPGUARDE_API_KEY }}
          project-id: cmrxda2bp001xnq0vg287eqba
          target-url: https://shipguard-demo-shipguard-demo-pr-${{ github.event.number }}.up.railway.app/
          flow: >-
            Click the button labelled "Status" in the filter bar. In the menu that
            opens, click the option labelled "Failed". Confirm the table shows only
            rows with a Failed badge and the count reads "5 of 20 runs".
          fail-on: block

      - run: echo "verdict ${{ steps.shipguarde.outputs.verdict }} run ${{ steps.shipguarde.outputs.run-id }}"
